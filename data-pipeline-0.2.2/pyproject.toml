[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "optical-materials-pipeline"
version = "0.2.2"
description = "Validated optical response data with a common tensor interface"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "PyYAML>=6,<7", "matplotlib>=3.8,<4"]

[project.optional-dependencies]
notebook = ["jupyterlab>=4,<5", "ipykernel>=6,<8"]
dev = ["build>=1,<2", "nbclient>=0.10,<1", "nbformat>=5,<6", "setuptools>=69"]

[tool.setuptools]
packages = ["src"]

[tool.setuptools.package-data]
# Include every material payload, including nested files and custom extensions.
src = ["data/**/*"]
